<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>한글 서식 이식</title>
  <meta name="description" content="파일 A의 글꼴·여백·표 서식에 파일 B의 내용만 옮겨 새 HWPX를 만듭니다." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f3ead8;
      --sheet: #fffdf7;
      --ink: #1b1612;
      --muted: #6d6256;
      --rule: #d8cbb3;
      --stamp: #b42318;
      --ok: #1f6b45;
      --shadow: 0 18px 50px rgba(60, 42, 20, 0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(180, 35, 24, 0.06), transparent 50%),
        var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Sans KR", sans-serif;
    }

    body {
      background-image:
        linear-gradient(to right, rgba(180, 140, 90, 0.07) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(180, 140, 90, 0.07) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 48px 20px 80px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 36px;
    }

    .mark {
      width: 72px;
      height: 72px;
      border: 3px solid var(--stamp);
      color: var(--stamp);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: "Noto Serif KR", serif;
      font-size: 28px;
      letter-spacing: -0.04em;
      transform: rotate(-8deg);
      flex-shrink: 0;
    }

    h1 {
      font-family: "Noto Serif KR", serif;
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.15;
      margin: 0 0 10px;
      letter-spacing: -0.03em;
    }

    .lede {
      margin: 0;
      max-width: 46ch;
      color: var(--muted);
      font-size: 1.02rem;
    }

    .sheet {
      background: var(--sheet);
      border: 1px solid var(--rule);
      box-shadow: var(--shadow);
      padding: 28px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 16px;
      align-items: stretch;
    }

    .drop {
      border: 1.5px dashed #b9a78a;
      min-height: 220px;
      padding: 22px;
      background: rgba(243, 234, 216, 0.35);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .drop:hover, .drop.over {
      border-color: var(--stamp);
      background: rgba(180, 35, 24, 0.04);
    }

    .drop h2 {
      margin: 0 0 6px;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--stamp);
    }

    .drop p {
      margin: 0 0 18px;
      font-family: "Noto Serif KR", serif;
      font-size: 1.35rem;
    }

    .file-name {
      color: var(--muted);
      font-size: 0.92rem;
      word-break: break-all;
    }

    .arrow {
      display: grid;
      place-items: center;
      color: var(--stamp);
      font-size: 1.6rem;
      font-family: "Noto Serif KR", serif;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 22px;
    }

    button {
      appearance: none;
      border: 0;
      background: var(--ink);
      color: var(--sheet);
      padding: 13px 22px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--rule);
    }

    .hint {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .status {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--rule);
      display: none;
    }

    .status.show { display: block; }

    .status.error { color: var(--stamp); }
    .status.ok { color: var(--ok); }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 0.92rem;
    }

    th, td {
      text-align: left;
      padding: 8px 0;
      border-bottom: 1px solid var(--rule);
    }

    th { color: var(--muted); font-weight: 500; width: 46%; }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
      .arrow { transform: rotate(90deg); height: 24px; }
      header { flex-direction: column-reverse; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>한글 서식 이식</h1>
        <p class="lede">파일 A에서 글꼴, 크기, 색, 줄간격, 여백, 표 테두리만 가져오고, 파일 B의 문장과 표 내용만 남긴 HWPX를 만듭니다.</p>
      </div>
      <div class="mark" aria-hidden="true">이</div>
    </header>

    <section class="sheet">
      <div class="grid">
        <label class="drop" id="drop-style">
          <h2>File A</h2>
          <p>서식 원본</p>
          <div class="file-name" id="name-style">HWPX를 놓거나 클릭해서 선택</div>
          <input id="file-style" type="file" accept=".hwpx" hidden />
        </label>
        <div class="arrow" aria-hidden="true">→</div>
        <label class="drop" id="drop-content">
          <h2>File B</h2>
          <p>내용 원본</p>
          <div class="file-name" id="name-content">HWPX를 놓거나 클릭해서 선택</div>
          <input id="file-content" type="file" accept=".hwpx" hidden />
        </label>
      </div>

      <div class="actions">
        <button id="run" type="button">C 만들기</button>
        <button id="reset" class="ghost" type="button">지우기</button>
        <span class="hint">.hwp는 한글에서 HWPX로 다시 저장한 뒤 올려 주세요. 두 파일을 합쳐 약 4.5MB를 넘기지 않는 것이 안전합니다.</span>
      </div>

      <div class="status" id="status"></div>
    </section>

    <footer>
      A의 문장은 가져오지 않습니다. B의 서식은 버립니다. 결과 파일 C는 한글에서 열어 확인하세요.
    </footer>
  </div>

  <script>
    const styleInput = document.getElementById("file-style");
    const contentInput = document.getElementById("file-content");
    const styleName = document.getElementById("name-style");
    const contentName = document.getElementById("name-content");
    const statusEl = document.getElementById("status");
    const runBtn = document.getElementById("run");
    const resetBtn = document.getElementById("reset");

    function bindDrop(box, input, label) {
      box.addEventListener("dragover", (event) => {
        event.preventDefault();
        box.classList.add("over");
      });
      box.addEventListener("dragleave", () => box.classList.remove("over"));
      box.addEventListener("drop", (event) => {
        event.preventDefault();
        box.classList.remove("over");
        if (event.dataTransfer.files[0]) {
          input.files = event.dataTransfer.files;
          label.textContent = event.dataTransfer.files[0].name;
        }
      });
      input.addEventListener("change", () => {
        label.textContent = input.files[0] ? input.files[0].name : "HWPX를 놓거나 클릭해서 선택";
      });
    }

    bindDrop(document.getElementById("drop-style"), styleInput, styleName);
    bindDrop(document.getElementById("drop-content"), contentInput, contentName);

    function showStatus(html, kind) {
      statusEl.className = "status show " + kind;
      statusEl.innerHTML = html;
    }

    resetBtn.addEventListener("click", () => {
      styleInput.value = "";
      contentInput.value = "";
      styleName.textContent = "HWPX를 놓거나 클릭해서 선택";
      contentName.textContent = "HWPX를 놓거나 클릭해서 선택";
      statusEl.className = "status";
      statusEl.innerHTML = "";
    });

    const labels = {
      a_charPr: "A 글자 서식",
      a_paraPr: "A 문단 서식",
      a_styles: "A 스타일",
      a_borderFill: "A 테두리/배경",
      a_font_faces: "A 글꼴",
      b_section_paras: "B 문단 수",
      b_section_tables: "B 표 수",
      out_size: "결과 크기(byte)",
    };

    runBtn.addEventListener("click", async () => {
      if (!styleInput.files[0] || !contentInput.files[0]) {
        showStatus("서식 파일 A와 내용 파일 B를 모두 선택해 주세요.", "error");
        return;
      }

      const form = new FormData();
      form.append("style", styleInput.files[0]);
      form.append("content", contentInput.files[0]);

      runBtn.disabled = true;
      showStatus("이식 중입니다. 잠시만 기다려 주세요.", "ok");

      try {
        const response = await fetch("/api/transplant", { method: "POST", body: form });
        if (!response.ok) {
          let message = "이식에 실패했습니다.";
          try {
            const payload = await response.json();
            if (payload.error) message = payload.error;
          } catch (_) {}
          showStatus(message, "error");
          return;
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "transplanted.hwpx";
        link.click();
        URL.revokeObjectURL(url);

        let rows = "";
        const summaryHeader = response.headers.get("X-Transplant-Summary");
        if (summaryHeader) {
          const summary = JSON.parse(summaryHeader);
          rows = "<table>" + Object.keys(labels).map((key) => {
            if (summary[key] == null) return "";
            return "<tr><th>" + labels[key] + "</th><td>" + summary[key] + "</td></tr>";
          }).join("") + "</table>";
        }

        showStatus("결과 파일 C를 받았습니다." + rows, "ok");
      } catch (error) {
        showStatus("요청을 보내지 못했습니다. 네트워크 상태를 확인해 주세요.", "error");
      } finally {
        runBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
